plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.0"
	id "org.jetbrains.kotlin.plugin.serialization" version "2.4.0"
	id "io.gitlab.arturbosch.detekt" version "1.23.8"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"magnus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
			runDir "build/gametest"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

def mcParts = project.minecraft_version.split("\\.").collect { Integer.parseInt(it) }
def isMc1211Latest = mcParts.size() >= 3 && mcParts[0] == 1 && mcParts[1] == 21 && mcParts[2] > 1

if (isMc1211Latest) {
	sourceSets.main.kotlin.srcDir 'src/latest/kotlin'
} else {
	sourceSets.main.kotlin.srcDir 'src/baseline/kotlin'
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // Domain & Infrastructure dependencies
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${project.kotlin_serialization_version}"
    include "org.jetbrains.kotlinx:kotlinx-serialization-json:${project.kotlin_serialization_version}"

    implementation "org.jetbrains.exposed:exposed-core:${project.exposed_version}"
    implementation "org.jetbrains.exposed:exposed-dao:${project.exposed_version}"
    implementation "org.jetbrains.exposed:exposed-jdbc:${project.exposed_version}"
    implementation "org.jetbrains.exposed:exposed-kotlin-datetime:${project.exposed_version}"
    include "org.jetbrains.exposed:exposed-core:${project.exposed_version}"
    include "org.jetbrains.exposed:exposed-dao:${project.exposed_version}"
    include "org.jetbrains.exposed:exposed-jdbc:${project.exposed_version}"
    include "org.jetbrains.exposed:exposed-kotlin-datetime:${project.exposed_version}"

    implementation "com.zaxxer:HikariCP:${project.hikaricp_version}"
    include "com.zaxxer:HikariCP:${project.hikaricp_version}"

    implementation "redis.clients:jedis:${project.jedis_version}"
    include "redis.clients:jedis:${project.jedis_version}"

    // Jedis transitive dependency (required for connection pooling)
    implementation "org.apache.commons:commons-pool2:2.13.1"
    include "org.apache.commons:commons-pool2:2.13.1"

    implementation "org.postgresql:postgresql:${project.postgres_version}"
    include "org.postgresql:postgresql:${project.postgres_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
    testImplementation "io.mockk:mockk:1.14.11"
    testImplementation "org.jetbrains.kotlin:kotlin-test"

    testImplementation "org.testcontainers:testcontainers:2.0.5"
    testImplementation "org.testcontainers:junit-jupiter:2.0.5"
    testImplementation "org.testcontainers:postgresql:2.0.5"
    testImplementation "com.redis:testcontainers-redis:2.2.4"
    
    // Coroutines test support
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"

    detektPlugins "io.gitlab.arturbosch.detekt:detekt-formatting:1.23.8"
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	def modMetadata = [
		version          : project.version,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version,
	]

	if (!isMc1211Latest) {
		from('src/baseline/resources') {
			include 'fabric.mod.json'
			expand(modMetadata)
		}
	}

	inputs.properties(modMetadata)

	filesMatching("fabric.mod.json") {
		expand(modMetadata)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

detekt {
	config = files("$rootDir/detekt.yml")
	buildUponDefaultConfig = true
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
	jvmTarget = "21"
}
