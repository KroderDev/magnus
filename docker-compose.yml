services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: magnus
      POSTGRES_USER: magnus
      POSTGRES_PASSWORD: magnus
      REDIS_HOST: redis
      REDIS_PORT: 6379
    stdin_open: true
    tty: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: magnus
      POSTGRES_USER: magnus
      POSTGRES_PASSWORD: magnus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnus"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  gradle-cache:
  postgres-data:
  redis-data:
